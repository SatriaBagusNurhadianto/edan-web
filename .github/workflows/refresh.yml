name: Daily Scholarship Refresh
on:
  schedule:
    - cron: '0 17 * * *'  # 00:00 WIB (UTC+7)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/refresh-data.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/beasiswa.json
          git diff --cached --quiet || git commit -m "chore(data): refresh beasiswa (auto)"
          git push
